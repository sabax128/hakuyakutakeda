<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="CSS/style.css" />
<title>Hakuyaku Takeda Links</title>
</head>
<body>
  <div class="cap"></div>

  <div class="wrap">
    <div class="header">
      <div class="l">Hakuyaku Takeda</div>
      <div class="r"></div>
    </div>

    <div class="hero">
      <div class="hero-inner">
        <img class="hero-box" src="top.png" />
      </div>
    </div>

    <div class="content">
      <section class="section" id="music">
        <h2>音楽</h2>
        <div class="banners">
          <a href="https://www.youtube.com/@hakuyakutakeda"><img class="banner-img" src="link_banner/music.png" alt="musicLink"></a>
          <a href="https://soundcloud.com/hakuyaku-takeda"><img class="banner-img" src="link_banner/soundcloud.png" alt="SoundCloud"></a>
        </div>
      </section>

      <section class="section" id="sns">
        <h2>SNS</h2>
        <div class="banners">
          <a href="https://www.instagram.com/_hakuyaku_/"><img class="banner-img" src="link_banner/instagram.png" alt="instagram"></a>
          <a href="https://x.com/_hakuyaku_"><img class="banner-img" src="link_banner/x.png" alt="x"></a>
        </div>
      </section>

      <section class="section" id="misc">
        <h2>その他</h2>
        <div class="banners">
          <a class="banner" href="#"><div class="icon">mail</div><div class="txt"><div class="title">Contact</div><div class="desc">連絡先</div></div><div class="arrow">▶</div></a>
          <a class="banner" href="#"><div class="icon">?</div><div class="txt"><div class="title">About</div><div class="desc">このサイトについて</div></div><div class="arrow">▶</div></a>
        </div>
      </section>
    </div>

    <div class="meta">since January 22th, 2026 / Link Portal</div>
  </div>
</body>
</html>
